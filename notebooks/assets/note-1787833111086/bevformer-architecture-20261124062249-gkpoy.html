rojects/configs/bevformer/bevformer_base.py#L129"}, {"label": "Hungarian：hungarian_assigner_3d.py:1-160", "url": "https://github.com/fundamentalvision/bevformer/blob/66b65f3a1f58caf0507cb2a971b9c0e7f842376c/projects/mmdet3d_plugin/core/bbox/assigners/hungarian_assigner_3d.py#L1"}], "diagram": {"title": "预测、匹配与解码", "caption": "依据 BEVFormer 官方实现的真实 forward 顺序；B 为 batch，N=6 个相机，C=256。", "boxes": [["h", 0, 0, "Decoder hidden", "input"], ["cls", 1, 0, "分类分支", ""], ["box", 1, 1, "回归分支", ""], ["loss", 2, 0, "Hungarian + losses", ""], ["decode", 2, 1, "NMSFreeCoder", "output"]], "edges": [["h", "cls"], ["h", "box"], ["cls", "loss"], ["box", "loss"], ["box", "decode"], ["cls", "decode"]], "details": {"h": {"purpose": "接收每个 decoder 层的 object-level 表示。", "input": "[6,900,B,256] 或逐层 [900,B,256]", "output": "[B,900,256]（最后层）及所有中间层", "operators": "permute [layers, batch, queries, channels]；with_box_refine 保留中间层"}, "cls": {"purpose": "给每个 query 产生 10 类 sigmoid logits。", "input": "[B,900,256]", "output": "[B,900,10]", "operators": "Linear/cls_branch；FocalLoss(use_sigmoid=True, gamma=2, alpha=0.25)"}, "box": {"purpose": "回归归一化中心、尺寸、旋转和速度相关参数。", "input": "[B,900,256]；reference [B,900,3]", "output": "[B,900,10]", "operators": "reg_branch；与 reference 的逆 sigmoid 增量更新；L1 / GIoU cost"}, "loss": {"purpose": "将 900 个候选与 GT 3D 框一一匹配。", "input": "pred cls/bbox；gt_bboxes_3d、gt_labels_3d", "output": "标量 loss_cls、loss_bbox、loss_iou（配置权重）", "operators": "HungarianAssigner3D → FocalLoss + L1Loss + GIoULoss"}, "decode": {"purpose": "将无 NMS 的候选解码为最终 3D 检测结果。", "input": "bbox [B,900,10]；cls scores [B,900,10]", "output": "最多 300 个 boxes_3d、scores、labels", "operators": "NMSFreeCoder.decode → post_center_range filter → top-k(max_num=300)"}}, "blocks": []}, "variants": {"tiny": {"overview": ["cls [6,B,900,10]；bbox [6,B,900,10]", "最终最多 300 个 3D 框：boxes_3d、scores、labels"]}}}], "edges": [["input", "backbone", "img"], ["backbone", "fpn"], ["fpn", "bev-encoder", "multi-level value"], ["input", "bev-encoder", "meta + prev_bev"], ["bev-encoder", "decoder", "BEV memory"], ["decoder", "head", "hidden + reference"]], "sections": {"io": "\u003cdiv class=\"panel\">\u003ch2>输入输出\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003ctr>\u003cth>角色\u003c/th>\u003cth>形状 / 格式\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003ctr>\u003ctd>相机图像\u003c/td>\u003ctd>base [B,T=4,N=6,3,900,1600]；tiny [B,3,6,3,450,800]\u003c/td>\u003ctd>nuScenes 六相机 RGB，经归一化和 padding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>标定与状态\u003c/td>\u003ctd>lidar2img [B,N,4,4]；can_bus [B,18]；scene_token\u003c/td>\u003ctd>将 BEV reference 投影到图像特征，并估计时序位移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>训练标签\u003c/td>\u003ctd>gt_bboxes_3d、gt_labels_3d\u003c/td>\u003ctd>LiDAR 坐标系 3D 框和 10 类标签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>网络输出\u003c/td>\u003ctd>cls [6,B,900,10]；bbox [6,B,900,10]\u003c/td>\u003ctd>每层 decoder 的分类 logits 与框回归\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最终检测\u003c/td>\u003ctd>最多 300 个 boxes_3d、scores、labels\u003c/td>\u003ctd>NMSFreeCoder 解码并按空间范围过滤\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>边界\u003c/strong> 这里的 H/W 是配置和 padding 后的推导值，未运行 dataloader 验证每张图像的实际边界。\u003c/div>\u003c/div>", "config": "\u003cdiv class=\"panel\">\u003ch2>配置与张量约定\u003c/h2>\u003cdiv class=\"two\">\u003cdiv>\u003ch3>Base\u003c/h3>\u003cul>\u003cli>R101，stage3/4 使用 DCNv2，FPN 4 levels\u003c/li>\u003cli>BEV 200×200，encoder 6 层，decoder 6 层\u003c/li>\u003cli>embed_dims=256，FFN=512，num_query=900\u003c/li>\u003cli>point_cloud_range=[-51.2,-51.2,-5,51.2,51.2,3] m\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Tiny\u003c/h3>\u003cul>\u003cli>R50，单尺度 C5，FPN 1 level\u003c/li>\u003cli>BEV 50×50，encoder 3 层，decoder 6 层\u003c/li>\u003cli>输入标称尺寸 800×450，队列长度 3\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cp class=\"note\">代码中的 image 轴会在检测器与 transformer 之间经历 view/permute。图谱将逻辑语义统一写成 [B,N,C,H,W]，并在内部节点注明 [B×N] 或 [N,B] 形式。\u003c/p>\u003c/div>", "mechanics": "\u003cdiv class=\"panel\">\u003ch2>机制演示：BEV reference 投影与稀疏采样\u003c/h2>\u003cp>拖动 BEV 网格位置，观察一个 3D reference 如何映射到六个相机平面。示意使用归一化坐标，目的是解释 camera mask 与多点采样，数值不替代实际标定。\u003c/p>\u003cdiv class=\"atlas-demo\">\u003clabel for=\"bev-x\">BEV x\u003c/label>\u003cinput id=\"bev-x\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\">\u003clabel for=\"bev-y\">BEV y\u003c/label>\u003cinput id=\"bev-y\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.5\">\u003cp id=\"bev-demo-output\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003cp class=\"note\">实际代码在 spatial_cross_attention.py 中先生成 reference_3d，再通过 lidar2img 投影，越界点由 mask 排除，MSDeformableAttention3D 每个 level 采样 8 个点。\u003c/p>\u003c/div>", "training": "\u003cdiv class=\"panel\">\u003ch2>训练与推理\u003c/h2>\u003col class=\"steps\">\u003cli>\u003cstrong>训练输入\u003c/strong> 队列样本由 CustomNuScenesDataset 提供，当前帧与历史帧按 queue_length 组织，标签经过 ObjectRangeFilter 与 ObjectNameFilter。\u003c/li>\u003cli>\u003cstrong>前向\u003c/strong> 图像 backbone/FPN → BEV encoder → decoder → head，train_cfg 使用 HungarianAssigner3D。\u003c/li>\u003cli>\u003cstrong>损失\u003c/strong> FocalLoss 分类权重 2.0，L1 框回归权重 0.25，GIoU 权重 0.0；optimizer 为 AdamW，lr=2e-4，24 epochs。\u003c/li>\u003cli>\u003cstrong>视频推理\u003c/strong> video_test_mode=true 时在相同 scene_token 内缓存 prev_bev，scene 切换时清空。post_center_range 过滤后取 max_num=300。\u003c/li>\u003c/ol>\u003cp class=\"note\">这些是配置和源码路径的静态核对结果，不代表本页面已完成数据集加载、CUDA 算子执行或指标复现。\u003c/p>\u003c/div>", "innovation": "\u003cdiv class=\"panel\">\u003ch2>创新与问题\u003c/h2>\u003cdetails open>\u003csummary>论文贡献：时空 BEV 表示\u003c/summary>\u003cp>\u003cstrong>论文贡献\u003c/strong> 用 Temporal Self-Attention 融合历史 BEV，用 Spatial Cross-Attention 将 BEV queries 稀疏关联到多相机特征。\u003cstrong>代码证据\u003c/strong> encoder layer 的 operation_order 与两个自定义注意力模块。\u003cstrong>适用边界\u003c/strong> 依赖相机标定、连续帧和稳定的 scene_token，单帧或标定失配时历史与投影收益会下降。\u003c/p>\u003cp class=\"source-line\">\u003ca href=\"https://arxiv.org/abs/2203.17270\">论文\u003c/a>\u003c/p>\u003c/details>\u003cdetails>\u003csummary>工程问题：高分辨率 BEV 的显存与采样开销\u003c/summary>\u003cp>\u003cstrong>触发\u003c/strong> base 使用 40000 个 BEV tokens，encoder 6 层，空间注意力还要维护 camera mask、reference 和多尺度 value。\u003cstrong>影响\u003c/strong> 显存和 CUDA deformable attention 开销随 BEV 网格、相机数和采样点增长。\u003cstrong>已有方向\u003c/strong> tiny 配置通过 50×50、单尺度和 3 层降低成本。\u003cstrong>局限\u003c/strong> tiny 的精度与 base 不能直接等价，页面没有性能实测。\u003c/p>\u003c/details>\u003cdetails>\u003csummary>代码观察：bbox 回归与 reference 的迭代 refine\u003c/summary>\u003cp>\u003cstrong>依据\u003c/strong> decoder.py 中 inverse_sigmoid(reference)+delta 后 sigmoid，并 detach 后进入下一层。\u003cstrong>影响\u003c/strong> 回归分支能逐层收紧空间位置，但梯度不会穿过更新后的 reference。\u003cstrong>是否可直接集成\u003c/strong> 这是当前实现已有行为，替换 decoder 或 reference 参数化需要重新核对张量轴和训练稳定性。\u003c/p>\u003c/details>\u003c/div>", "sources": "\u003cdiv class=\"panel\">\u003ch2>论文对照与来源\u003c/h2>\u003cdiv class=\"sources\">\u003cp>\u003ca href=\"https://arxiv.org/abs/2203.17270\">BEVFormer 论文\u003c/a>：论文图示强调时空 Transformer 与 BEV queries，本页补充了代码中的 queue、camera mask、level_start_index、decoder reference refine。\u003c/p>\u003cp>\u003ca href=\"https://github.com/fundamentalvision/bevformer/tree/66b65f3a1f58caf0507cb2a971b9c0e7f842376c\">官方仓库固定 commit\u003c/a>：66b65f3a1f58caf0507cb2a971b9c0e7f842376c。\u003c/p>\u003cp>\u003ca href=\"https://github.com/fundamentalvision/bevformer/blob/66b65f3a1f58caf0507cb2a971b9c0e7f842376c/projects/configs/bevformer/bevformer_base.py#L34-L156\">Base 配置\u003c/a> 与 \u003ca href=\"https://github.com/fundamentalvision/bevformer/blob/66b65f3a1f58caf0507cb2a971b9c0e7f842376c/projects/configs/bevformer/bevformer_tiny.py#L30-L156\">Tiny 配置\u003c/a>。\u003c/p>\u003cp class=\"note\">检索日期：2026-11-24。外部链接用于追溯论文和源码，页面主体不依赖联网资源。\u003c/p>\u003c/div>\u003c/div>"}};
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function links(refs){return refs.map(r=>`<a href="${escapeHTML(r.url)}" target="_blank" rel="noopener">${escapeHTML(r.label)} ↗</a>`).join('')}
let mode=DATA.default_mode||DATA.modes[0].id,selected=DATA.nodes[0].id,modalModule=selected,zoom=null,diagramSerial=0;
const ids=DATA.nodes.map(n=>n.id),byId=Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
function current(n){return {...n,...(n.variants?.[mode]||{})}}
function color(n){return DATA.groups.find(g=>g.id===n.group).color}
function modeData(){return DATA.modes.find(m=>m.id===mode)}
function sectionData(){return {...DATA.sections,...(modeData().sections||{})}}
function wrappedText(text,limit=31){let result=[],line='',units=0;for(const c of String(text)){const u=c.charCodeAt(0)>255?2:1;if(units+u>limit&&line){result.push(line);line='';units=0}line+=c;units+=u}if(line)result.push(line);return result}
function dimensionText(s){return String(s)}
function moduleSVG(g,color,compact=false){
  const marker='module-arrow-'+(++diagramSerial),cw=380,colStep=460,gap=90;
  const fieldDefs=compact?[['输入','input'],['输出','output']]:[['作用','purpose'],['输入','input'],['输出','output'],['算子 / 执行顺序','operators']];
  const layout=g.boxes.map((b,index)=>{const details=g.details[b[0]],titles=wrappedText(b[3],35);const fields=fieldDefs.map(([label,key])=>({label,key,lines:wrappedText(dimensionText(details[key]),44)}));const height=32+titles.length*22+fields.reduce((h,f)=>h+45+f.lines.length*19,0);return {b,index,titles,fields,height}});
  const rowCount=Math.max(...g.boxes.map(b=>b[2]))+1,rowHeights=Array(rowCount).fill(0);
  layout.forEach(o=>rowHeights[o.b[2]]=Math.max(rowHeights[o.b[2]],o.height));
  const ys=[];let height=20;rowHeights.forEach(h=>{ys.push(height);height+=h+gap});height-=gap-20;
  const cols=Math.max(...g.boxes.map(b=>b[1]))+1,width=cols*colStep-40;
  layout.forEach(o=>{o.x=20+o.b[1]*colStep;o.y=ys[o.b[2]]});
  const svg=el('svg',{viewBox:`0 0 ${width} ${height}`,width,height,style:`--natural-width:${width}px`,class:'module-svg',role:'img','aria-label':g.title+(compact?'；各模块输入输出维度。':'；每节点标有作用、输入输出维度及算子顺序。')});
  svg.append(el('title',{},g.title));
  const defs=el('defs'),m=el('marker',{id:marker,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});m.append(el('path',{d:'M0 0L10 5L0 10Z',fill:'#7188a2'}));defs.append(m);svg.append(defs);
  const boxes=Object.fromEntries(layout.map(o=>[o.b[0],o]));
  const lineGroup=el('g',{'aria-hidden':'true'});
  for(const [from,to,label] of g.edges){const a=boxes[from],b=boxes[to];let path,lx,ly;
    if(a.b[2]===b.b[2]){const right=b.x>a.x,sx=right?a.x+cw:a.x,tx=right?b.x:b.x+cw;const midY=Math.min(a.y+a.height/2,b.y+b.height/2);path=`M${sx} ${midY}H${tx}`;lx=(sx+tx)/2;ly=midY-12;}
    else if(b.b[2]-a.b[2]===1){const mid=ys[b.b[2]]-gap/2;path=`M${a.x+cw/2} ${a.y+a.height}V${mid}H${b.x+cw/2}V${b.y}`;lx=(a.x+b.x)/2+cw/2;ly=mid-9;}
    else {const gutter=a.x+cw+34;path=`M${a.x+cw/2} ${a.y+a.height}V${a.y+a.height+24}H${gutter}V${b.y-25}H${b.x+cw/2}V${b.y}`;lx=gutter+6;ly=b.y-36;}
    lineGroup.append(el('path',{d:path,fill:'none',stroke:'#7188a2','stroke-width':2,'marker-end':`url(#${marker})`,'stroke-dasharray':label==='identity'?'7 5':'none'}));
    if(label)lineGroup.append(el('text',{x:lx,y:ly,'text-anchor':'middle',class:'module-edge-label'},label));
  }svg.append(lineGroup);
  for(const o of layout){const [id,col,row,title,kind]=o.b,group=el('g',{transform:`translate(${o.x},${o.y})`,'data-op':id});let fill='#ffffff',stroke='#b9cadd';if(kind==='input'||kind==='output'){fill=color+'0c';stroke=color}if(kind==='merge'){fill='#f7f3fc';stroke='#9579ba'}
    group.append(el('rect',{width:cw,height:o.height,rx:10,fill,stroke,'stroke-width':1.5}));
    let y=29;o.titles.forEach((line,i)=>{group.append(el('text',{x:16,y,class:'module-op-title'},(i===0?String(o.index+1).padStart(2,'0')+' · ':'')+line));y+=22});
    for(const f of o.fields){y+=19;group.append(el('text',{x:16,y,class:'module-field-label','data-field-label':f.key},f.label));y+=21;f.lines.forEach(line=>{group.append(el('text',{x:16,y,class:'module-op-body','data-field':f.key},line));y+=19});y+=5;}
    group.append(el('title',{},title+'；'+fieldDefs.map(([label,key])=>label+'：'+dimensionText(g.details[id][key])).join('；')));svg.append(group);
  }
  return svg.outerHTML;
}

function mainGraph(){const g={title:DATA.title+' 总架构',caption:'',boxes:[],details:{},edges:modeData().edges||DATA.edges,blocks:[]};DATA.nodes.forEach((base,i)=>{const n=current(base);const row=Math.floor(i/3),col=row%2?2-i%3:i%3,[c,r]=n.position||[col,row];g.boxes.push([n.id,c,r,n.title,'output']);g.details[n.id]={input:n.overview[0],output:n.overview[1]}});return g}
function resizeGraph(){const svg=$('overview').querySelector('svg');if(!svg)return;const width=+svg.getAttribute('viewBox').split(' ')[2],z=zoom??$('viewport').clientWidth/width;svg.style.width=width*z+'px';svg.style.minWidth='0';$('zoom-label').textContent=Math.round(z*100)+'%'}
function renderGraph(){$('overview').innerHTML=moduleSVG(mainGraph(),'#2563eb',true);$('overview').querySelectorAll('[data-op]').forEach(g=>{const n=current(byId[g.dataset.op]);g.setAttribute('data-open-module-overview',n.id);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',n.title+'；输入：'+n.overview[0]+'；输出：'+n.overview[1]);g.style.opacity=n.active===false?'.3':'1';const rect=g.querySelector('rect');rect.setAttribute('stroke',color(n));rect.setAttribute('fill',color(n)+'0a');g.onclick=()=>select(n.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id)}}});resizeGraph()}
function graphBody(g,n){return `<h3>${escapeHTML(g.title)}</h3>${moduleSVG(g,color(n))}<p class="diagram-caption">${escapeHTML(g.caption)}</p>${(g.blocks||[]).map(b=>`<details class="inner-block"><summary>${escapeHTML(b.title)}</summary><div>${graphBody(b,n)}</div></details>`).join('')}`}
function diagramBody(n){return `<div class="diagram-main"><p class="diagram-caption">${escapeHTML(DATA.dimension_legend)}<br>箭头表示数据依赖，分叉分支并行；卡片编号用于定位，框内 → 表示算子执行顺序。默认按原尺寸阅读，可横向滚动或适应宽度。</p>${graphBody(n.diagram,n)}</div>`}
function detailHTML(n){return `<p class="lede">${escapeHTML(n.summary)}</p>${n.active===false?'<p class="note">当前配置不执行此模块，保留作为对照。</p>':''}<div class="shape"><div class="shape-label">INPUT</div><div class="shape-value">${escapeHTML(n.overview[0])}</div><div class="shape-arrow">↓</div><div class="shape-label">OUTPUT</div><div class="shape-value">${escapeHTML(n.overview[1])}</div></div><div class="module-diagram"><div class="module-diagram-head"><h3>内部架构图</h3><button data-open-module="${n.id}">展开详细大图 ↗</button></div><div class="diagram-preview">${moduleSVG(n.diagram,color(n))}</div><p class="diagram-caption">${escapeHTML(n.diagram.caption)}</p></div>${n.formula?'<pre>'+escapeHTML(n.formula)+'</pre>':''}<h3>内部算子与执行顺序</h3>${n.ops.map(([a,b])=>`<div class="op"><strong>${escapeHTML(a)}</strong><p>${escapeHTML(b)}</p></div>`).join('')}${n.code?'<h3>关键代码</h3><pre>'+escapeHTML(n.code)+'</pre>':''}<h3>读代码时注意</h3><ul>${n.notes.map(s=>'<li>'+escapeHTML(s)+'</li>').join('')}</ul><h3>对应源码</h3><div class="sources">${links(n.refs)}</div>`}
function renderIndex(){const q=$('search').value.trim().toLowerCase(),matches=DATA.nodes.map(current).filter(n=>JSON.stringify(n).toLowerCase().includes(q));$('search-count').textContent=matches.length+' / '+DATA.nodes.length+' 模块';$('module-index').innerHTML=matches.map(n=>`<button data-select-module="${n.id}" class="${n.id===selected?'active':''}" style="--c:${color(n)}"><i></i>${escapeHTML(n.title)}${n.active===false?' · 对照':''}</button>`).join('')||'<p class="empty">没有匹配模块。</p>'}
function select(id){selected=id;const n=current(byId[id]),i=ids.indexOf(id);$('detail-title').textContent=n.title;$('detail-group').textContent=DATA.groups.find(g=>g.id===n.group).label;$('detail-body').innerHTML=detailHTML(n);$('detail-body').scrollTop=0;$('module-number').textContent=(i+1)+' / '+ids.length;$('prev').disabled=i===0;$('next').disabled=i===ids.length-1;renderIndex();$('overview').querySelectorAll('[data-op]').forEach(g=>g.setAttribute('aria-pressed',String(g.dataset.op===id)))}
function renderModal(id){modalModule=id;const n=current(byId[id]),i=ids.indexOf(id);$('diagram-title').textContent=n.title+' · 内部架构';$('diagram-context').textContent=modeData().label+(n.active===false?' · 此配置不执行，仅作对照':'');$('diagram-select').value=id;$('diagram-surface').innerHTML=diagramBody(n);$('diagram-sources').innerHTML=links(n.refs);$('diagram-prev').disabled=i===0;$('diagram-next').disabled=i===ids.length-1;$('diagram-scroll').scrollTop=0}
function openModule(id){renderModal(id);if(!$('diagram-dialog').open)$('diagram-dialog').showModal()}
function tab(id){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!==id);document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});history.replaceState(null,'','#'+id);$(id).scrollIntoView({block:'start'});if(id==='architecture')resizeGraph()}
function renderMode(){mode=$('task').value;const s=sectionData();$('mode-note').textContent=modeData().label;$('shape-mode').textContent=modeData().label;renderGraph();select(selected);$('tensor-rows').innerHTML=DATA.nodes.map(current).filter(n=>n.active!==false).map(n=>`<tr class="clickrow" data-select-module="${n.id}" tabindex="0"><td>${escapeHTML(n.title)}</td><td class="mono">${escapeHTML(n.overview[0])}</td><td class="mono">${escapeHTML(n.overview[1])}</td></tr>`).join('');$('io-content').innerHTML=s.io;$('config-content').innerHTML=s.config;for(const k of ['mechanics','training','innovation'])$(k).innerHTML=s[k];$('sources-content').innerHTML=s.sources;const refs=new Map();for(const n of DATA.nodes.map(current))for(const r of n.refs)refs.set(r.url,r);$('all-sources').innerHTML=links([...refs.values()]);if($('diagram-dialog').open)renderModal(modalModule);document.dispatchEvent(new CustomEvent('atlas:mode',{detail:{mode}}))}
$('brand').textContent=DATA.model;$('hero-title').textContent=DATA.title;$('subtitle').textContent=DATA.subtitle;$('baseline').textContent=DATA.baseline;$('dimension-legend').textContent=DATA.dimension_legend;document.title=DATA.model+' · 模型架构交互图谱';
for(const [id,url] of [['paper-link',DATA.paper_url],['repo-link',DATA.repo_url]]){if(url)$(id).href=url;else $(id).hidden=true}
$('legend').innerHTML=DATA.groups.map(g=>`<span style="--c:${g.color}">${escapeHTML(g.label)}</span>`).join('');$('task').innerHTML=DATA.modes.map(m=>`<option value="${m.id}">${escapeHTML(m.label)}</option>`).join('');$('task').value=mode;$('diagram-select').innerHTML=DATA.nodes.map(n=>`<option value="${n.id}">${escapeHTML(n.title)}</option>`).join('');
$('task').onchange=renderMode;$('diagram-select').onchange=e=>renderModal(e.target.value);$('diagram-close').onclick=()=>$('diagram-dialog').close();$('diagram-prev').onclick=()=>renderModal(ids[ids.indexOf(modalModule)-1]);$('diagram-next').onclick=()=>renderModal(ids[ids.indexOf(modalModule)+1]);$('diagram-fit').onclick=()=>$('diagram-surface').classList.add('fit-diagrams');$('diagram-original').onclick=()=>$('diagram-surface').classList.remove('fit-diagrams');
$('prev').onclick=()=>select(ids[ids.indexOf(selected)-1]);$('next').onclick=()=>select(ids[ids.indexOf(selected)+1]);$('search').oninput=renderIndex;$('zoom-fit').onclick=()=>{zoom=null;resizeGraph()};$('zoom-real').onclick=()=>{zoom=1;resizeGraph()};$('zoom-in').onclick=()=>{const svg=$('overview').querySelector('svg');zoom=Math.min(2,(zoom??$('viewport').clientWidth/(+svg.getAttribute('viewBox').split(' ')[2]))*1.25);resizeGraph()};$('zoom-out').onclick=()=>{const svg=$('overview').querySelector('svg');zoom=Math.max(.05,(zoom??$('viewport').clientWidth/(+svg.getAttribute('viewBox').split(' ')[2]))/1.25);resizeGraph()};
$('wide-mode').onclick=()=>{const on=document.querySelector('.workspace').classList.toggle('wide');$('wide-mode').textContent=on?'图文并排':'大图阅读';zoom=null;resizeGraph()};window.addEventListener('resize',resizeGraph);
document.addEventListener('click',e=>{const b=e.target.closest('[data-open-module]'),s=e.target.closest('[data-select-module]'),t=e.target.closest('[data-tab]');if(b)openModule(b.dataset.openModule);if(s){tab('architecture');select(s.dataset.selectModule)}if(t){e.preventDefault();tab(t.dataset.tab)}});document.addEventListener('keydown',e=>{const row=e.target.closest('tr[data-select-module]');if(row&&e.key==='Enter'){tab('architecture');select(row.dataset.selectModule)}});
$('print').onclick=()=>window.print();window.addEventListener('beforeprint',()=>{$('print-appendix').innerHTML='<h1>逐模块附录</h1>'+DATA.nodes.map(current).map(n=>`<article class="print-module"><h2>${escapeHTML(n.title)}</h2>${detailHTML(n)}${diagramBody(n).replaceAll('<details class=','<details open class=')}</article>`).join('')});window.addEventListener('afterprint',()=>$('print-appendix').replaceChildren());
renderMode();if(['architecture','io','tensors','mechanics','training','innovation','sources'].includes(location.hash.slice(1)))tab(location.hash.slice(1));
(function () {
  function updateProjection() {
    var x = Number(document.getElementById('bev-x').value);
    var y = Number(document.getElementById('bev-y').value);
    var cameras = ['前视', '前左', '前右', '后视', '后左', '后右'];
    var visible = cameras.filter(function (_, i) { return ((x * 10 + y * 7 + i) % 3) !== 0; });
    var text = '归一化 BEV reference = [' + x.toFixed(2) + ', ' + y.toFixed(2) + ', z=0.50]；示意可见相机：' + visible.join('、') + '；每个可见相机再采样 4 个 pillar 高度 × 8 个 deformable points。';
    document.getElementById('bev-demo-output').textContent = text;
  }
  function bind() {
    var x = document.getElementById('bev-x');
    var y = document.getElementById('bev-y');
    if (!x || !y) return;
    x.addEventListener('input', updateProjection);
    y.addEventListener('input', updateProjection);
    updateProjection();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();

</script></body></html>
